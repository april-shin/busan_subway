name: seoul_subway
description: "서울 지하철 노선도 - 경로 검색 및 실시간 도착 정보"
publish_to: 'none'
version: 1.4.0+12

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Immutable Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # WebView
  webview_flutter: ^4.10.0
  # Android 렌더링 모드(Hybrid Composition) 설정용 — 팬 중 화면 점멸 방지
  webview_flutter_android: ^4.12.0

  # XML
  xml: ^6.5.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.19.1
  # 벽시계 주입용. 화면이 `DateTime.now()` 대신 `clock.now()` 를 쓰면 위젯에
  # 테스트 전용 파라미터를 뚫지 않고도 `withClock` 으로 시각을 고정할 수 있다.
  # (자정 부근에만 깨지던 출발시각 시트 테스트 4건이 이 방식으로 결정적이 됐다.)
  clock: ^1.1.2
  flutter_dotenv: ^5.2.1
  package_info_plus: ^10.2.1

  # Ads
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^3.0.0

  # Testing
  mocktail: ^1.0.4

  # App Icon
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # Swift Package Manager 비활성화 (iOS 빌드는 CocoaPods 유지).
  #
  # SPM 을 켜면 SPM 을 지원하는 플러그인(webview_flutter_wkwebview,
  # path_provider_foundation 등)이 CocoaPods 선언에서 빠지는데,
  # google_mobile_ads(5.3.1)는 CocoaPods 전용이면서 podspec 에서
  # `webview_flutter_wkwebview` 를 의존한다. 그 결과 pod install 이
  # "Unable to find a specification for `webview_flutter_wkwebview`
  # depended upon by `google_mobile_ads`" 로 실패한다.
  #
  # 이 플래그가 없으면 `flutter build ios` 가 매번 Xcode 프로젝트에 SPM 을
  # 자동 마이그레이션하므로, pbxproj 를 되돌리는 것만으로는 막을 수 없다.
  # google_mobile_ads 가 SPM 을 지원하는 버전으로 올라가면 제거할 것.
  config:
    enable-swift-package-manager: false

  assets:
    - .env
    - assets/svg/
    - assets/json/
    - assets/html/
