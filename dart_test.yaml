# 실 API 호출 테스트(@Tags(['real-api']))는 서울 열린데이터 실 API 를 전 역에
# 대해 호출한다(약 5~10분 소요, 일일 호출 한도 소모, 네트워크 필요). 따라서 기본
# `flutter test` 실행에서는 제외(skip)한다 — CI·로컬 기본 실행이 실 API 를
# 건드리거나 쿼터를 소모하지 않도록.
#
# 주의: 'integration' 태그는 실 API 를 쓰지 않는 로컬 통합 테스트
# (find_path_full_coverage, transfer_membership)에도 붙어 있으므로 skip 대상이
# 아니다. 실 네트워크 호출 테스트만 'real-api' 로 구분해 제외한다.
#
# 실 API 테스트를 명시적으로 실행하려면:
#   flutter test --run-skipped --tags real-api
tags:
  integration:
  real-api:
    skip: "실 API 호출 테스트 — 기본 실행 제외. 실행: flutter test --run-skipped --tags real-api"
